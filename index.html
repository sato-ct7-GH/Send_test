<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信テスト｜湘南高校 物理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f5f7fa;
  --surface:  #ffffff;
  --surface2: #eef1f6;
  --border:   #d0d8e8;
  --accent:   #1a6fd4;
  --accent-h: #155ab0;
  --correct:  #0a9e6e;
  --wrong:    #d93025;
  --warn-bg:  #fde8e8;
  --ok-bg:    #e6f8f2;
  --rec-c:    #7c3aed;
  --rec-bg:   #f3eeff;
  --text:     #1a2236;
  --text2:    #4a5a7a;
  --text3:    #8a9ab8;
  --radius:   12px;
  --radius-sm:7px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 40px;
}

header {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:fixed; top:0; left:0; right:0; z-index:100;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.header-inner {
  max-width:520px; margin:0 auto;
  padding:14px 18px;
}
.header-title { font-size:1.05rem; font-weight:700; color:var(--text); letter-spacing:.04em; }
.header-sub   { font-size:.72rem; color:var(--text3); margin-top:2px; letter-spacing:.06em; }

.wrap {
  width:100%; max-width:520px;
  margin-top:80px;
}

/* ── カード ── */
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px 24px 24px;
  display:flex; flex-direction:column; gap:18px;
}

.form-badge {
  display:inline-block;
  background:var(--rec-bg); color:var(--rec-c);
  font-size:.75rem; font-weight:700;
  padding:4px 12px; border-radius:20px;
}

.inp-label {
  font-size:.82rem; color:var(--text2); font-weight:700;
  margin-bottom:-10px;
  border-left:3px solid var(--accent);
  padding-left:8px;
}

.inp-field {
  width:100%; padding:11px 14px;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text); font-size:.95rem;
  font-family:inherit; outline:none;
  transition:border-color .15s;
}
.inp-field:focus { border-color:var(--accent); background:#fff; }
.inp-field::placeholder { color:var(--text3); }

/* ── チェックボックスグループ ── */
.chk-group {
  display:flex; flex-direction:column; gap:0;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.chk-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .12s;
  user-select:none;
}
.chk-item:last-child { border-bottom:none; }
.chk-item:hover { background:var(--surface2); }
.chk-item input[type="checkbox"] {
  width:18px; height:18px;
  accent-color:var(--accent);
  cursor:pointer; flex-shrink:0;
}
.chk-item input[type="radio"] {
  width:18px; height:18px;
  accent-color:var(--accent);
  cursor:pointer; flex-shrink:0;
}
.chk-item span {
  font-size:.92rem; color:var(--text);
  line-height:1.4;
}
.chk-item.checked {
  background:#eef4ff;
}
.chk-item.checked span { color:var(--accent); font-weight:700; }

/* ── エラー ── */
.err-text { font-size:.8rem; color:var(--wrong); display:none; margin-top:-10px; }
.err-text.show { display:block; }

/* ── 送信ボタン ── */
.send-btn {
  width:100%; padding:13px;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  color:#fff; border:none;
  border-radius:var(--radius-sm);
  font-size:.95rem; font-weight:700;
  cursor:pointer; font-family:inherit;
  transition:opacity .15s;
  margin-top:4px;
}
.send-btn:hover  { opacity:.88; }
.send-btn:disabled { opacity:.45; cursor:default; }

/* ── 結果 ── */
.send-ok {
  background:var(--ok-bg); border:1px solid var(--correct);
  border-radius:var(--radius-sm); padding:16px;
  color:var(--correct); font-size:.9rem;
  text-align:center; font-weight:700;
  line-height:1.8;
}
.send-ng {
  background:var(--warn-bg); border:1px solid var(--wrong);
  border-radius:var(--radius-sm); padding:14px;
  color:var(--wrong); font-size:.85rem;
  text-align:center; font-weight:700;
  line-height:1.8;
}
.send-ng small { font-weight:400; font-size:.78rem; color:#b02020; }
.ghost-btn {
  width:100%; padding:11px;
  background:none; color:var(--text2);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:.88rem; cursor:pointer;
  font-family:inherit; transition:all .15s;
}
.ghost-btn:hover { border-color:var(--accent); color:var(--accent); }
.retry-btn {
  width:100%; padding:13px;
  background:linear-gradient(135deg,#d93025,#a02020);
  color:#fff; border:none;
  border-radius:var(--radius-sm);
  font-size:.95rem; font-weight:700;
  cursor:pointer; font-family:inherit;
  transition:opacity .15s;
}
.retry-btn:hover { opacity:.88; }

/* ── 説明文 ── */
.desc {
  font-size:.82rem; color:var(--text2);
  line-height:1.75;
  background:var(--surface2);
  border-left:3px solid var(--accent);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:10px 14px;
}

/* ── セクション区切り ── */
.section-divider {
  border:none; border-top:1px dashed var(--border);
  margin:0;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">送信テスト</div>
    <div class="header-sub">神奈川県立湘南高等学校　物理</div>
  </div>
</header>

<div class="wrap">
  <div class="card" id="main-card">
    <div class="form-badge">📤 動作確認用　送信テスト</div>
    <div class="desc">
      各項目を入力・選択して「送信する」を押してください。<br>
      送信が正常に完了したか確認するためのテストです。
    </div>

    <!-- 組番号 -->
    <label class="inp-label">組番号</label>
    <input id="inp-cls" class="inp-field" type="text"
           placeholder="例：C01〜E50" autocomplete="off">

    <!-- 氏名 -->
    <label class="inp-label">氏名</label>
    <input id="inp-name" class="inp-field" type="text"
           placeholder="例：湘南　太郎" autocomplete="off">

    <hr class="section-divider">

    <!-- 端末の種類 -->
    <div class="inp-label">端末の種類</div>
    <div class="chk-group" id="grp-device">
      <label class="chk-item"><input type="radio" name="device" value="iPhone"><span>iPhone</span></label>
      <label class="chk-item"><input type="radio" name="device" value="Android"><span>Android</span></label>
      <label class="chk-item"><input type="radio" name="device" value="iPad"><span>iPad</span></label>
      <label class="chk-item"><input type="radio" name="device" value="Chromebook"><span>Chromebook</span></label>
      <label class="chk-item"><input type="radio" name="device" value="その他"><span>その他</span></label>
    </div>

    <!-- Classroomの開き方 -->
    <div class="inp-label">Classroomの開き方</div>
    <div class="chk-group" id="grp-classroom">
      <label class="chk-item"><input type="radio" name="classroom" value="Chrome"><span>Chrome（ブラウザ）</span></label>
      <label class="chk-item"><input type="radio" name="classroom" value="Safari"><span>Safari（ブラウザ）</span></label>
      <label class="chk-item"><input type="radio" name="classroom" value="Edge"><span>Edge（ブラウザ）</span></label>
      <label class="chk-item"><input type="radio" name="classroom" value="その他のブラウザ"><span>その他のブラウザ</span></label>
      <label class="chk-item"><input type="radio" name="classroom" value="Classroomアプリ"><span>Classroomアプリ</span></label>
    </div>

    <!-- ブラウザの種類 -->
    <div class="inp-label">ブラウザの種類</div>
    <div class="chk-group" id="grp-browser">
      <label class="chk-item"><input type="radio" name="browser" value="Chrome"><span>Chrome</span></label>
      <label class="chk-item"><input type="radio" name="browser" value="Safari"><span>Safari</span></label>
      <label class="chk-item"><input type="radio" name="browser" value="Edge"><span>Edge</span></label>
      <label class="chk-item"><input type="radio" name="browser" value="その他のブラウザ"><span>その他のブラウザ</span></label>
    </div>

    <div class="err-text" id="inp-err">すべての項目を入力・選択してください。</div>

    <button class="send-btn" id="send-btn" onclick="doSend()">📤 送信する</button>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyrTIXJX1646wPwuUJiSRogqajqwOkbcqiNmqx9Yj3NdoL5-XJd-ZmV6SWG1o-65L4a/exec';

/* ラジオ選択時に行をハイライト */
document.querySelectorAll('.chk-group input[type="radio"]').forEach(radio => {
  radio.addEventListener('change', () => {
    const grp = radio.closest('.chk-group');
    grp.querySelectorAll('.chk-item').forEach(item => item.classList.remove('checked'));
    radio.closest('.chk-item').classList.add('checked');
  });
});

function getRadio(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : '';
}

/* 送信パラメータをグローバルに保持（リトライ用） */
let _sendParams = null;
let _sendMeta   = null;

async function doSend() {
  const cls       = document.getElementById('inp-cls').value.trim();
  const name      = document.getElementById('inp-name').value.trim();
  const device    = getRadio('device');
  const classroom = getRadio('classroom');
  const browser   = getRadio('browser');
  const err       = document.getElementById('inp-err');

  if (!cls || !name || !device || !classroom || !browser) {
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = '📤 送信中…';

  const now = new Date();
  const ts  = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} `
             + `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  _sendMeta = { cls, name, device, classroom, browser };
  _sendParams = new URLSearchParams({
    timestamp:  ts,
    class:      cls,
    name:       name,
    section:    '送信テスト',
    score:      '－',
    total:      '－',
    device:     device,
    classroom:  classroom,
    browser:    browser,
    comment:    ''
  });

  await trySend(btn, 1);
}

async function trySend(btn, attempt) {
  const MAX_RETRY = 3;
  try {
    if (btn) {
      btn.textContent = attempt === 1 ? '📤 送信中…' : `🔄 再送信中… (${attempt}/${MAX_RETRY})`;
    }

    await fetch(`${GAS_URL}?${_sendParams}`, {
      method: 'GET',
      mode:   'no-cors'   // CORSエラーを回避（opaqueレスポンス）
    });

    /* fetchが例外なく完了 → GASに到達したと判断 */
    const { cls, name, device, classroom, browser } = _sendMeta;
    showResult(cls, name, device, classroom, browser);

  } catch (e) {
    if (attempt < MAX_RETRY) {
      /* 2秒待ってリトライ */
      await new Promise(r => setTimeout(r, 2000));
      await trySend(btn, attempt + 1);
    } else {
      /* 全リトライ失敗 */
      showError();
    }
  }
}

function showResult(cls, name, device, classroom, browser) {
  const card = document.getElementById('main-card');
  card.innerHTML = `
    <div class="form-badge">📤 動作確認用　送信テスト</div>
    <div class="send-ok">
      ✅ 送信完了！<br>
      <small style="font-weight:400;font-size:.82rem;line-height:2">
        ${esc(cls)}　${esc(name)}<br>
        端末：${esc(device)}　／　Classroom：${esc(classroom)}<br>
        ブラウザ：${esc(browser)}
      </small>
    </div>
    <button class="ghost-btn" onclick="location.reload()">← もう一度テストする</button>
  `;
}

function showError() {
  const card = document.getElementById('main-card');
  const { cls, name, device, classroom, browser } = _sendMeta;
  card.innerHTML = `
    <div class="form-badge">📤 動作確認用　送信テスト</div>
    <div class="send-ng">
      ❌ 送信に失敗しました<br>
      <small>ネットワークに接続されているか確認して、もう一度お試しください。<br>
      （3回試みましたが、いずれも届きませんでした）</small>
    </div>
    <button class="retry-btn" onclick="retryFromError()">🔄 もう一度送信する</button>
    <button class="ghost-btn" onclick="location.reload()">← 最初からやり直す</button>
  `;
}

async function retryFromError() {
  const card = document.getElementById('main-card');
  /* リトライボタンを無効化 */
  const btn = card.querySelector('.retry-btn');
  if (btn) { btn.disabled = true; btn.textContent = '🔄 送信中…'; }
  await trySend(btn, 1);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
